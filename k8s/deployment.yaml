apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app: payments
    product: lumen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
        product: lumen
    spec:
      containers:
        - name: payments
          # CI overwrites the tag with the commit SHA on each deploy
          image: vinny1996/lumen-payments:v1
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
