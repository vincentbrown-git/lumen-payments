apiVersion: v1
kind: Service
metadata:
  name: payments
  labels:
    app: payments
    product: lumen
spec:
  # LoadBalancer = AWS provisions an ELB with a public DNS name.
  # Use ClusterIP if this should only be reachable from inside the cluster.
  type: LoadBalancer
  selector:
    app: payments
  ports:
    - name: http
      port: 80          # external port on the load balancer
      targetPort: 8080  # port the container listens on
